name: verify

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Cache yarn and corepack
        uses: actions/cache@v6
        with:
          path: |
            ~/.yarn/berry/cache
            ~/.cache/kphoto
            ~/.cache/node/corepack
          key: checks-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', 'scripts/lib.sh') }}

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Format check
        run: ./scripts/format.sh --check

      - name: Lint
        run: ./scripts/lint.sh

      - name: Typecheck (TypeScript 7)
        run: ./scripts/typecheck.sh

      - name: Typecheck (TypeScript 7.1 preview)
        run: ./scripts/typecheck-next.sh

      - name: Unit tests
        run: ./scripts/test-unit.sh

      - name: Build
        run: ./scripts/build.sh

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    env:
      HOME: /root
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache yarn and corepack
        uses: actions/cache@v6
        with:
          path: |
            ~/.yarn/berry/cache
            ~/.cache/kphoto
            ~/.cache/node/corepack
          key: e2e-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', 'scripts/lib.sh') }}

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Build
        run: ./scripts/build.sh

      - name: End-to-end tests
        run: ./scripts/test-e2e.sh
